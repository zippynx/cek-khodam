<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cek Khodam — Temukan Entitasmu</title>
    <meta
      name="description"
      content="Masukkan namamu dan temukan khodam yang menemanimu selama ini."
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <div class="toast" id="toast" role="alert" aria-live="polite">
      <i class="ph ph-warning-circle toast-icon"></i>
      <span id="toastMessage"></span>
    </div>

    <div class="page-wrapper">
      <div class="header-badge">
        <span class="dot"></span>
        Sistem Gaib v2.0
      </div>

      <div class="card" role="main">
        <div class="card-header">
          <div class="icon-circle" aria-hidden="true">
            <i class="ph-fill ph-eye"></i>
          </div>
          <h1 class="card-title">Cek Khodam</h1>
          <p class="card-subtitle">
            Masukkan namamu & temukan entitas yang menyertaimu
          </p>
        </div>

        <div class="divider" aria-hidden="true">
          <div class="divider-line"></div>
          <i class="ph ph-sparkle divider-icon"></i>
          <div class="divider-line"></div>
        </div>

        <div class="input-group">
          <label class="input-label" for="nameInput">Nama Kamu</label>
          <div class="input-wrapper">
            <i class="ph ph-user input-icon" aria-hidden="true"></i>
            <input
              type="text"
              id="nameInput"
              placeholder="Ketik nama kamu di sini…"
              autocomplete="off"
              spellcheck="false"
              maxlength="60"
              aria-label="Masukkan nama kamu"
            />
            <button
              id="btnClear"
              class="btn-clear"
              type="button"
              aria-label="Hapus teks"
              style="display: none"
            >
              <i class="ph ph-x-circle"></i>
            </button>
          </div>
        </div>

        <button
          class="btn-primary"
          id="btnCek"
          type="button"
          aria-label="Mulai cek khodam"
        >
          <span class="btn-text">
            <i class="ph ph-crystal-ball"></i>
            <span>Ungkap Khodam</span>
          </span>
        </button>

        <div
          class="loading-state"
          id="loadingState"
          aria-live="polite"
          aria-label="Memuat hasil"
        >
          <div class="spinner-ring">
            <div class="spinner-inner"></div>
          </div>
          <p class="loading-text" id="loadingText">Membuka portal mistis…</p>
        </div>

        <div class="result-container" id="resultContainer" aria-live="polite">
          <div class="result-box" id="captureBox">
            <div class="result-label">Khodam Pendamping</div>
            <div class="result-name" id="resultName"></div>
            <div class="result-separator"></div>
            <p class="result-meaning" id="resultMeaning"></p>
          </div>
          <div class="action-buttons">
            <button class="btn-secondary" id="btnShare" type="button">
              <i class="ph ph-download-simple"></i> Simpan Hasilnya
            </button>
            <button
              class="btn-reset"
              id="btnReset"
              type="button"
              aria-label="Coba nama lain"
            >
              <i class="ph ph-arrow-counter-clockwise"></i> Ulangi
            </button>
          </div>
        </div>
      </div>

      <div
        class="history-container"
        id="historyContainer"
        style="display: none"
      >
        <h3 class="history-title">Riwayat Terakhir</h3>
        <ul class="history-list" id="historyList"></ul>
      </div>
    </div>

    <footer class="footer">
      <span>© 2026</span>
      <a href="#" target="_blank" rel="noopener noreferrer">ZippyNx</a>
      <span> · Sistem Pengungkap Entitas Nusantara</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
